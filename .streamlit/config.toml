# Look and feel. Change base to "dark" for a dark version of the app.
[theme]
base = "light"
primaryColor = "#6366F1"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter"
headingFontWeights = [800, 700, 650]
headingFontSizes = ["2.3rem", "1.6rem", "1.15rem"]
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
chartCategoricalColors = ["#6366F1", "#EC4899", "#14B8A6", "#F59E0B", "#3B82F6", "#8B5CF6", "#EF4444"]

[client]
toolbarMode = "minimal"
