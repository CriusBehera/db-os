# Copy this to .streamlit/secrets.toml (on your computer) or paste it into
# Streamlit Cloud → your app → Settings → Secrets. Never commit real passwords.
[mysql]
host = "localhost"          # cloud: the host your MySQL provider gives you
port = 3306                 # cloud: often a different port, e.g. 12345
user = "school_app"
password = "change-me"
database = "school_db"
# ssl_ca = "ca.pem"         # cloud: path to the provider's CA certificate (turns on TLS)

# Nuera Core AI for the AI assistant (ai.criusbehera.com)
[nuera]
email = "your-nuera-access-key"
platform = "w"
url = "https://nueracoreai-pro-get-ai.criusbehera.com"

# Google sign-in (optional). See "Google sign-in" in DEPLOY.md.
# Without this section the "Continue with Google" button stays greyed out.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"   # online: https://YOUR-APP.streamlit.app/oauth2callback
cookie_secret = "a-long-random-text"                    # python3 -c "import secrets; print(secrets.token_hex(32))"
client_id = "xxxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxxx"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Email verification (Firebase Authentication). See "Email verification" in DEPLOY.md.
[firebase]
api_key = "AIza..."   # Firebase console → Project settings → General → Web API Key
