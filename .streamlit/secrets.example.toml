# Copy this to .streamlit/secrets.toml (on your computer) or paste it into
# Streamlit Cloud → your app → Settings → Secrets. Never commit real passwords.
[mysql]
host = "localhost"          # cloud: the host your MySQL provider gives you
port = 3306                 # cloud: often a different port, e.g. 12345
user = "school_app"
password = "change-me"
database = "school_db"
# ssl_ca = "ca.pem"         # cloud: path to the provider's CA certificate (turns on TLS)
